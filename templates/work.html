<section id="work" class="work section">
  <h1 class="section-header">Recent Work</h1>
  <hr class="section-header-underline">

  <div class="video-gallery">
    {% for project in projects %}
      <div class="gallery-item">
        <div class="gallery-item-caption">
          <div>
            <h2>{{ project.name }}</h2>
            <p>{{ artworks[project.name]["subtitle"] }}</p>
          </div>
        </div>

        <a
          data-fancybox="{{ project.name }}"
          href="{{ url_for('static', filename=project.preview) }}"
          data-caption="
            <h2>{{ project.name }}</h2>
            <p><em>{{ artworks[project.name]['subtitle'] }}</em></p>
            <p>{{ artworks[project.name]['description'] }}</p>
            <p><small>{{ artworks[project.name]['year'] }}</small></p>
          ">
          <img class="img-responsive"
               src="{{ url_for('static', filename=project.preview) }}"
               alt="Vertical Plotter Artwork {{ project.name }}">
        </a>
      </div>

      {% for f in project.files[1:] %}
        <a data-fancybox="{{ project.name }}"
           href="{{ url_for('static', filename='assets/img/art/' ~ project.name ~ '/' ~ f) }}"
           hidden></a>
      {% endfor %}
    {% endfor %}
  </div>
</section>

<div class="clearfix"></div>
